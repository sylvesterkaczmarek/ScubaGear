name: Validate release comparison pagination
on:
  push:
    branches: [validation/release-compare-pages]
permissions:
  contents: write
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare clean candidate
        shell: bash
        run: |
          cp utils/workflow/Tests/ReleaseNotesPagination.Tests.ps1 "$RUNNER_TEMP/pagination-tests.ps1"
          git switch -c fix/release-compare-pages 7ef9501d7de9804ddb9d6013af6b665cccfb39d9
          python - <<'PY'
          import os
          from pathlib import Path
          source = (Path(os.environ['RUNNER_TEMP']) / 'pagination-tests.ps1').read_text()
          source = source.replace("'../New-ReleaseNotes.ps1'", "'../../utils/workflow/New-ReleaseNotes.ps1'")
          Path('Testing/workflow/ReleaseNotesPagination.Tests.ps1').write_text(source)
          PY
      - name: Install test tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
      - name: Reproduce original failure
        shell: pwsh
        run: |
          Import-Module Pester -RequiredVersion 5.7.1
          $Result = Invoke-Pester -Path Testing/workflow/ReleaseNotesPagination.Tests.ps1 -PassThru -Output Detailed
          if ($Result.FailedCount -ne 2 -or $Result.PassedCount -ne 5) {
              throw "Unexpected baseline outcome: $($Result.FailedCount) failures, $($Result.PassedCount) passes"
          }
          $global:LASTEXITCODE = 0
      - name: Apply pagination fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('utils/workflow/New-ReleaseNotes.ps1')
          source = p.read_text()
          start = source.index('    $Comparison = Invoke-GitHubApi -Path "repos/$Owner/$Repository/compare/$BaseHead"')
          end = source.index('    $PullRequestsByNumber = @{}', start)
          replacement = '\n'.join([
              '    $ComparisonPages = @(Invoke-GitHubApi `',
              '        -Path "repos/$Owner/$Repository/compare/$BaseHead" `',
              "        -Query @{ per_page = '100' } `",
              '        -Paginate)',
              '    $Commits = @($ComparisonPages | ForEach-Object { $_.commits })',
              '    $CommitCount = $Commits.Count',
              '    Write-Warning "Comparing $BaseHead : $CommitCount commits (status: $($ComparisonPages[0].status))."',
              '', '',
          ])
          source = source[:start] + replacement + source[end:]
          old = '    foreach ($Commit in @($Comparison.commits)) {'
          assert source.count(old) == 1
          p.write_text(source.replace(old, '    foreach ($Commit in $Commits) {', 1))
          PY
      - name: Run regression and existing release tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module Pester -RequiredVersion 5.7.1
          $PSVersionTable.PSVersion
          $Result = Invoke-Pester -Path Testing/workflow/ReleaseNotesPagination.Tests.ps1,Testing/workflow/New-ReleaseNotes.Tests.ps1 -PassThru -Output Detailed
          if ($Result.FailedCount -ne 0 -or $Result.PassedCount -ne 26) { throw 'Release-note tests failed' }
          $Findings = @(Invoke-ScriptAnalyzer -Path Testing/workflow/ReleaseNotesPagination.Tests.ps1 -Severity Error,Warning)
          if ($Findings.Count) { $Findings | Format-List; throw 'New test analyzer findings' }
          git show 7ef9501d7de9804ddb9d6013af6b665cccfb39d9:utils/workflow/New-ReleaseNotes.ps1 | Set-Content "$env:RUNNER_TEMP/OriginalReleaseNotes.ps1"
          $Before = @(Invoke-ScriptAnalyzer "$env:RUNNER_TEMP/OriginalReleaseNotes.ps1" -Severity Error,Warning | ForEach-Object { "$($_.RuleName):$($_.Message)" } | Sort-Object)
          $After = @(Invoke-ScriptAnalyzer utils/workflow/New-ReleaseNotes.ps1 -Severity Error,Warning | ForEach-Object { "$($_.RuleName):$($_.Message)" } | Sort-Object)
          if (($Before -join "`n") -cne ($After -join "`n")) { throw 'Production analyzer findings changed' }
      - name: Validate Windows PowerShell 5.1
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Install-PackageProvider NuGet -Force -Scope CurrentUser
          Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force
          Import-Module Pester -RequiredVersion 5.7.1
          $PSVersionTable.PSVersion
          $Result = Invoke-Pester -Path Testing/workflow/ReleaseNotesPagination.Tests.ps1,Testing/workflow/New-ReleaseNotes.Tests.ps1 -PassThru -Output Detailed
          if ($Result.FailedCount -ne 0 -or $Result.PassedCount -ne 26) { throw 'PowerShell 5.1 release-note tests failed' }
      - name: Publish clean tested branch
        if: runner.os == 'Linux'
        shell: bash
        run: |
          git diff --check
          git add utils/workflow/New-ReleaseNotes.ps1 Testing/workflow/ReleaseNotesPagination.Tests.ps1
          git config user.name 'Sylvester Kaczmarek'
          git config user.email '16242628+sylvesterkaczmarek@users.noreply.github.com'
          git commit -s -m 'Include every comparison page in release notes'
          git push origin HEAD:refs/heads/fix/release-compare-pages
          git log -1 --format='%H %s'
