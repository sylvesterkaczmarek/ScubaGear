name: Validate PIM role exclusions
on:
  push:
    branches: [validation/2393-pim-exclusions]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: open-policy-agent/setup-opa@v2.4.0
      - name: Inspect fixture and policy results
        shell: bash
        run: |
          ROOT=PowerShell/ScubaGear
          opa eval --format pretty -d "$ROOT/Rego" -d "$ROOT/Testing/Unit/Rego/AAD" 'data.aad_test.PimPolicyResult([{"DisplayName":"Global Administrator","Assignments":[{"PrincipalId":"example","StartDateTime":"2026-09-09T00:00:00Z"}]}], {})'
          opa eval --format pretty -d "$ROOT/Rego" -d "$ROOT/Testing/Unit/Rego/AAD" 'data.aad_test.PimPolicyResult([{"DisplayName":"Global Administrator","Assignments":[{"PrincipalId":"example","StartDateTime":null}]}], {})'
          opa eval --format pretty -d "$ROOT/Rego" -d "$ROOT/Testing/Unit/Rego/AAD" 'data.utils.aad.Aad2P2Licenses with input as {"service_plans":data.aad_test.ServicePlans}'
          opa test "$ROOT"/Rego/*.rego "$ROOT"/Rego/Utils/*.rego "$ROOT"/Testing/Unit/Rego/AAD/*.rego --run test_PimRoleExclusions_ --format=json > "$RUNNER_TEMP/results.json" || true
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          for t in json.loads((Path(os.environ['RUNNER_TEMP'])/'results.json').read_text()):
              print(t['name'], 'FAIL' if t.get('fail') else 'PASS')
          PY
